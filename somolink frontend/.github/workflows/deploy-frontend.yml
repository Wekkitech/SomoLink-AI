name: Build & Deploy Frontend

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '23.x'

      - name: Install dependencies
        run: npm install

      - name: Build Vue app
        run: npm run build

      # 1️⃣ Remove existing dist folder
      - name: Remove old dist on VM
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            sudo rm -rf ${{ secrets.VM_FRONTEND_PATH }}/dist

      # 2️⃣ Copy new dist folder
      - name: Copy new dist to VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          source: dist/
          target: ${{ secrets.VM_FRONTEND_PATH }}

      # 3️⃣ Run deploy script
      - name: Run deploy script
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            sudo bash ${{ secrets.VM_DEPLOY_SCRIPT }}
